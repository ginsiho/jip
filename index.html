    * {
      box-sizing: border-box;
    }

    :root {
      --text-color: #242321;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
  font-family:
    var(--site-font, "FontA"),
    "Apple SD Gothic Neo",
    sans-serif;

  color: var(--text-color);
  background: #d8c6ab;
}

    button,
    textarea,
    input {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

   
    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: var(--room-color, #d8c6ab);
      isolation: isolate;
    }

    .room-image {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-position: center;
      background-size: cover;
      pointer-events: none;
    }

   
    .image-viewport {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .image-world {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }

    .jamo-tile {
      position: absolute;
      overflow: visible;
    }

    .jamo-tile img,
    .jamo-tile canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      max-width: none;
      max-height: none;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .jamo-tile canvas {
      image-rendering: pixelated;
    }

    .fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: 60px;
      line-height: 1;
      transform-origin: 0 0;
    }

   
    .jamo-motion {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      overflow: visible;
    }

    .jamo-motion.elastic-enter {
      animation:
        elastic-rubber 760ms cubic-bezier(0.2, 0.95, 0.25, 1) both;
      will-change: transform;
    }

    @keyframes elastic-rubber {
      0% {
        transform:
          rotate(var(--tilt, 0deg))
          scale(var(--stretch-x, 1), var(--stretch-y, 1));
      }

      18% {
        transform:
          rotate(calc(var(--tilt, 0deg) * -0.72))
          scale(
            calc(1 - (var(--stretch-x, 1) - 1) * 0.78),
            calc(1 + (1 - var(--stretch-y, 1)) * 0.70)
          );
      }

      42% {
        transform:
          rotate(calc(var(--tilt, 0deg) * 0.34))
          scale(
            calc(1 + (var(--stretch-x, 1) - 1) * 0.36),
            calc(1 - (1 - var(--stretch-y, 1)) * 0.24)
          );
      }

      68% {
        transform:
          rotate(calc(var(--tilt, 0deg) * -0.14))
          scale(
            calc(1 - (var(--stretch-x, 1) - 1) * 0.12),
            calc(1 + (1 - var(--stretch-y, 1)) * 0.08)
          );
      }

      100% {
        transform:
          rotate(var(--rest-tilt, 0deg))
          scale(1, 1);
      }
    }

  
    .navigation {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    .nav-text {
      position: absolute;
      margin: 0;
      padding: 4px 4px;
      border: 0;
      border-radius: 0;
      background: #ff146a;
      color: #ffffff;
      font-size: clamp(36px, 3vw, 46px);
      font-weight: 400;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      pointer-events: auto;
    }

    .nav-text:focus-visible {
      outline: 1px dashed currentColor;
      outline-offset: 2px;
    }

    .position-top {
      top: calc(24px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%);
    }

    .position-left {
      top: 50%;
      left: calc(24px + env(safe-area-inset-left, 0px));
      transform: translateY(-50%);
    }

    .position-right {
      top: 50%;
      right: calc(24px + env(safe-area-inset-right, 0px));
      transform: translateY(-50%);
    }

    .position-bottom {
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
    }

    .position-center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 3vw, 34px);
    }

    .position-top-right {
      top: calc(24px + env(safe-area-inset-top, 0px));
      right: calc(24px + env(safe-area-inset-right, 0px));
    }

    .ime-input {
      position: absolute;
      bottom: 80px;
      left: 50%;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      opacity: 0;
      overflow: hidden;
      font-size: 16px;
      pointer-events: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

   
    .preview-dialog {
      width: 100vw;
      max-width: none;
      height: 100vh;
      height: 100svh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--text-color);
      background: transparent;
      overflow: hidden;
    }

    .preview-dialog::backdrop,
    .mail-dialog::backdrop,
    .keypad-dialog::backdrop {
      background: transparent;
    }

    .preview-container {
      width: 100%;
      height: 100%;
    }

    .preview-scroll {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 32px 16px;
      overflow: auto;
    }

    .preview-paper-group {
      --paper-action-size: 48px;
      --paper-action-gap: 48px;
      position: relative;
      flex-shrink: 0;
      width: min(720px, calc(100vw - 160px));
      margin: 0;
      padding: 0;
    }

    .preview-paper {
      position: relative;
      width: 100%;
      aspect-ratio: 210 / 297;
      margin: 0;
      padding: 0;
      border: 1px solid #000;
      overflow: hidden;
      background: #fff;
      box-shadow: none;
    }

    .paper-text-area {
      position: absolute;
      inset: 4% 6% 4%;
      overflow: auto;
      scrollbar-width: thin;
    }

    .preview-content {
      margin: 0;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .paper-send-area {
      position: absolute;
      right: 7%;
      bottom: 5%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .paper-send-button,
    .paper-trash-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 10px;
      border: 0;
      border-radius: 0;
      color: #242321;
      background: transparent;
      cursor: pointer;
    }

    .paper-send-button svg,
    .paper-trash-button svg {
      display: block;
      width: 28px;
      height: 28px;
      pointer-events: none;
    }

    .paper-send-button:hover,
    .paper-trash-button:hover {
      color: #00a3e8;
    }

    .paper-send-button:focus-visible,
    .paper-trash-button:focus-visible {
      outline: 1px dashed currentColor;
      outline-offset: 2px;
    }

    .paper-trash-button {
      position: absolute;
      bottom: 5%;
      left: calc(100% + var(--paper-action-gap));
      width: var(--paper-action-size);
      height: var(--paper-action-size);
      margin: 0;
    }

  
    .mail-dialog {
      position: fixed;
      inset: auto;
      width: min(340px, calc(100vw - 24px));
      max-width: none;
      max-height: calc(100svh - 24px);
      margin: 0;
      padding: 0;
      border: 1px solid #000;
      border-radius: 0;
      color: #242321;
      background: #fff;
      overflow: auto;
      box-shadow: none;
    }

    .mail-form {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
    }

    .mail-recipient {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 8px 0;
      border: 0;
      border-radius: 0;
      outline: none;
      background: transparent;
      box-shadow: none;
      font-size: 16px;
    }

    .mail-recipient::placeholder {
      color: #999;
    }

    .mail-recipient:focus {
      border: 0;
      outline: none;
      box-shadow: none;
    }

    .mail-submit {
      flex: 0 0 auto;
      width: auto;
      margin: 0;
      padding: 9px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #242321;
      box-shadow: none;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      cursor: pointer;
    }

    .mail-submit:hover,
    .mail-submit:active {
      border: 0;
      background: transparent;
      color: #242321;
      box-shadow: none;
    }

    .mail-submit:focus-visible {
      outline: 1px dashed #000;
      outline-offset: 3px;
    }

   
    .keypad-dialog {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100svh;
      max-width: none;
      max-height: none;
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: var(--text-color);
      background: transparent;
      box-shadow: none;
      overflow: hidden;
    }

    .storage-lock-group {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 130px;
      width: min(240px, calc(100vw - 48px));
      max-height: calc(100svh - 32px);
      overflow: auto;
      padding: 8px 0;
    }

    .storage-lock-panel {
      width: 100%;
      padding: 16px;
      border: 1px solid #000;
      background: #fff;
      color: #000;
      flex-shrink: 0;
    }

    .storage-keyhole {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border: 1px solid #000;
      border-radius: 50%;
      background: #fff;
    }

    .storage-keyhole svg {
      width: 28px;
      height: 34px;
    }

    .storage-keyhole.is-ready {
      outline: 1px dashed #000;
      outline-offset: 5px;
    }

    .storage-keyhole.is-unlocked svg {
      visibility: hidden;
    }

    /* 숨겨진 열쇠 영역 위치 */
.storage-key-zone {
  /* 이 두 값으로 위치 조절 */
  --key-x: 85vw;
  --key-y: 80vh;

  position: fixed;

  left: var(--key-x);
  top: var(--key-y);
  right: auto;
  bottom: auto;

  transform: translate(-50%, -50%);

  width: 100px;
  height: 100px;

  z-index: 2;
}

    .storage-key-zone[hidden] {
      display: none;
    }

    .storage-key {
      position: fixed;
      display: grid;
      place-items: center;
      left: 6px;
      top: 26px;
      width: 88px;
      height: 48px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #000;
      opacity: 0;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .storage-key svg {
      width: 88px;
      height: 48px;
      pointer-events: none;
    }

    .storage-key-zone:hover .storage-key,
    .storage-key:focus-visible,
    .storage-key.is-dragging {
      opacity: 1;
    }

    .storage-key.is-dragging {
      cursor: grabbing;
    }

    .storage-key:focus-visible {
      outline: 1px dashed #000;
    }

    .keypad-display {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      margin-bottom: 8px;
      padding-left: 8px;
      font-size: 24px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 8px;
      font-variant-numeric: tabular-nums;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .keypad-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 60px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: inherit;
      background: transparent;
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
    }

    .keypad-number:focus-visible {
      outline: 1px dashed currentColor;
      outline-offset: -8px;
    }

    .keypad-number[data-digit="0"] {
      grid-column: 2;
    }

    .keypad-dialog.is-error .storage-lock-panel {
      animation: keypad-shake 320ms ease-in-out;
    }

    @keyframes keypad-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    @media (max-width: 600px) {
      .position-top {
        top: calc(12px + env(safe-area-inset-top, 0px));
      }

      .position-left {
        left: calc(8px + env(safe-area-inset-left, 0px));
      }

      .position-right {
        right: calc(8px + env(safe-area-inset-right, 0px));
      }

      .position-bottom {
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      }

      .position-top-right {
        top: calc(12px + env(safe-area-inset-top, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
      }

      .preview-scroll {
        padding: 20px 12px;
      }

      .preview-paper-group {
        --paper-action-size: 40px;
        --paper-action-gap: 8px;
        width: calc(100vw - 120px);
      }

      .paper-send-button,
      .paper-trash-button {
        width: 40px;
        height: 40px;
        padding: 8px;
      }

      .paper-send-button svg,
      .paper-trash-button svg {
        width: 24px;
        height: 24px;
      }

      .mail-form {
        gap: 10px;
        padding: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .keypad-dialog.is-error .storage-lock-panel {
        animation: none;
      }
    }
  
    /* PDF 다운로드 / 여러 장 기록 대지 */
    .preview-paper-group .preview-paper + .preview-paper {
      margin-top: 24px;
    }
    .paper-text-area { overflow: hidden; }
    .preview-paper-group > .paper-send-area {
      right: auto;
      left: calc(100% + var(--paper-action-gap));
      bottom: calc(5% + var(--paper-action-size) + 12px);
    }
    .mail-dialog { width: min(420px, calc(100vw - 24px)); }
    .mail-form {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .download-note, .download-status {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .download-note { color: #666; }
    .mail-submit:disabled, .paper-send-button:disabled {
      opacity: .45;
      cursor: wait;
    }
    .pdf-render-stage {
      position: fixed;
      left: 0;
      top: 0;
      width: 720px;
      z-index: -10000;
      pointer-events: none;
      background: #fff;
    }
    .pdf-render-page {
      position: relative;
      width: 720px;
      height: 1018.2857142857px;
      margin: 0;
      border: 0;
      background: #fff;
      color: #242321;
      overflow: hidden;
    }
    .pdf-render-area {
      position: absolute;
      overflow: hidden;
    }
    .pdf-render-text {
      display: block;
      margin: 0;
      padding: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    /* 기록 창: A4 대지를 화면 중앙에 배치 */
.preview-scroll {
  display: flex;
  align-items: flex-start;
  justify-content: center;

  width: 100%;
  height: 100%;
  padding: 32px 16px;
  overflow: auto;
}

.preview-paper-group {
  /*
    가로 공간과 화면 높이를 모두 고려해서 크기 결정
    0.7070707 = A4의 가로 / 세로 비율 (210 / 297)
  */
  width: min(
    720px,
    calc(100vw - 160px),
    calc((100svh - 64px) * 0.7070707)
  );

  flex-shrink: 0;

  /* 한 장일 때 세로 중앙, 여러 장이면 위에서부터 스크롤 */
  margin: auto 0;
}

.preview-paper {
  width: 100%;
  aspect-ratio: 210 / 297;
}


    .nav-text { background: var(--button-color, #ff146a); color: #fff; }
    .nav-text.position-top { top: 0; }
    .nav-text.position-left { left: 0; }
    .nav-text.position-right { right: 0; }
    .nav-text.position-bottom { bottom: 0; }
    .nav-text.position-top-right { top: 0; right: 0; }
    /* 거실 음악 버튼: 컬러 원 + 흰색 음표 */
.living-music-button {
  position: absolute;
  top: 0;
  left: 0;

  display: grid;
  place-items: center;

  width: 44px;
  height: 44px;

  margin: 0;
  padding: 0;

  border: 0;
  border-radius: 50%;

  /* 텍스트 버튼과 동일한 배경색 */
  background: var(--button-color, #ff146a);

  /* SVG의 currentColor를 흰색으로 유지 */
  color: #ffffff;

  cursor: pointer;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
}

/* 키보드로 선택했을 때 표시 */
.living-music-button:focus-visible {
  outline: 1px dashed var(--button-color, #ff146a);
  outline-offset: 3px;
}

/* 원 안의 흰색 음표 */
.living-music-note {
  display: block;

  width: 28px;
  height: 28px;

  pointer-events: none;

  transform-origin: center;
  animation: living-note-spin 3s linear infinite;
  animation-play-state: paused;
}

/* 음악 재생 중에만 음표 회전 */
.living-music-button.is-playing .living-music-note {
  animation-play-state: running;
}

@keyframes living-note-spin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

/* 움직임 줄이기 설정 */
@media (prefers-reduced-motion: reduce) {
  .living-music-note {
    animation: none;
  }
}


    /* 공간별 배경 스트립: 타이핑 레이어와 독립 이동 */
    .room-image { overflow: hidden; }
    .room-background-panel {
      position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      background-repeat: no-repeat; will-change: transform;
    }

    /* 기록 버튼 위치: 화면 중앙 기준 이동 */
/* 기록 버튼: 위치는 개별 조정, 크기는 일반 버튼과 동일 */
#recordButton {
  /* 지금 맞춰둔 좌표로 변경 */
  --record-x: 250px;
  --record-y: -80px;

  /* 위치 */
  left: calc(50% + var(--record-x));
  top: calc(50% + var(--record-y));
  right: auto;
  bottom: auto;
  transform: translate(-50%, -50%);

  /* 다른 내비게이션 버튼과 동일한 크기 설정 */
  font-size: clamp(16px, 2vw, 22px);
  font-weight: 400;
  line-height: 1;
  padding: 4px;

  /* 별도로 지정된 너비·높이가 있다면 해제 */
  width: auto;
  height: auto;
}

/* 창고 → 거실: 왼쪽 아래 모서리 */
.nav-text.position-bottom-left {
  top: auto;
  right: auto;
  bottom: 0;
  left: 0;

  transform: none;
}

/* 기록 버튼: 사각형 배경 + 흰색 문서 아이콘 */
#recordButton {
  display: grid;
  place-items: center;

  /* 가로형 사각형 버튼 */
  width: 44px;
  height: 36px;
  padding: 4px;

  border: 0;
  border-radius: 0;

  background: var(--button-color, #ff146a);
  color: #ffffff;

<script>
(() => {
  /* 커서 이미지 크기 */
  const TRIANGLE_CURSOR_SIZE = 40;

  function updateTriangleCursor() {
    const root = document.documentElement;

    const buttonColor = getComputedStyle(root)
      .getPropertyValue("--button-color")
      .trim();

    /* 현재 사이트의 버튼 색상 형식: #RRGGBB */
    if (!/^#[0-9a-f]{6}$/i.test(buttonColor)) {
      return;
    }

    /* 버튼 색상의 RGB 반전색 */
    const original = parseInt(
      buttonColor.slice(1),
      16
    );

    const inverse = (0xFFFFFF ^ original)
      .toString(16)
      .padStart(6, "0");

    const color = `#${inverse}`;

    const size = TRIANGLE_CURSOR_SIZE;
    const canvas = document.createElement("canvas");

    canvas.width = size;
    canvas.height = size;

    const context = canvas.getContext("2d");

    if (!context) return;

    /* 위를 향하는 정삼각형 */
    const margin = 2;
    const side = size - margin * 2;
    const triangleHeight =
      side * Math.sqrt(3) / 2;

    const tipX = size / 2;
    const tipY = margin;

    context.clearRect(0, 0, size, size);

    context.beginPath();

    /* 위쪽 꼭짓점 */
    context.moveTo(tipX, tipY);

    /* 오른쪽 아래 꼭짓점 */
    context.lineTo(
      size - margin,
      margin + triangleHeight
    );

    /* 왼쪽 아래 꼭짓점 */
    context.lineTo(
      margin,
      margin + triangleHeight
    );

    context.closePath();

    context.fillStyle = color;
    context.fill();

    const imageUrl = canvas.toDataURL("image/png");

    /*
      실제 클릭 지점은 위쪽 꼭짓점.
      이미지가 적용되지 않으면 기본 커서 대신 숨김 처리.
    */
    const cursorValue =
      `url("${imageUrl}") ${tipX} ${tipY}, none`;

    /* 같은 값을 반복해서 설정하지 않음 */
    if (
      root.style.getPropertyValue("--triangle-cursor")
      !== cursorValue
    ) {
      root.style.setProperty(
        "--triangle-cursor",
        cursorValue
      );
    }
  }

  updateTriangleCursor();

  /* 버튼 색이 변경되면 반전색도 갱신 */
  const observer = new MutationObserver(
    updateTriangleCursor
  );

  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["style"]
  });
})();
</script>

    async function loadAudioBuffer(src) {
      if (audioBufferCache.has(src)) {
        return audioBufferCache.get(src);

      if (audioBufferLoading.has(src)) {
        return audioBufferLoading.get(src);

      const loading = (async () => {
        const ctx = getAudioContext();

        if (!ctx) {
          throw new Error("Web Audio API is unavailable.");

        const response = await fetch(src);

        if (!response.ok) {
          throw new Error(`Failed to fetch audio: ${src}`);

        const arrayBuffer = await response.arrayBuffer();
        const buffer = await ctx.decodeAudioData(arrayBuffer);

        audioBufferCache.set(src, buffer);

        return buffer;

    async function playClosetAudioBySrc(src, gainValue = 1) {
      if (!audioUnlocked || !src) return;

      try {
        const ctx = await resumeAudioContextIfNeeded();

        if (!ctx) return;

        const buffer = await loadAudioBuffer(src);

        const source = ctx.createBufferSource();
        source.buffer = buffer;

        const lowpassA = ctx.createBiquadFilter();
        lowpassA.type = "lowpass";
        lowpassA.frequency.value = CLOSET_SOUND_CUTOFF;
        lowpassA.Q.value = 0.707;

        const lowpassB = ctx.createBiquadFilter();
        lowpassB.type = "lowpass";
        lowpassB.frequency.value = CLOSET_SOUND_CUTOFF;
        lowpassB.Q.value = 0.707;

        const gainNode = ctx.createGain();
        gainNode.gain.value =
          gainValue * CLOSET_SOUND_GAIN;

        source.connect(lowpassA);
        lowpassA.connect(lowpassB);
        lowpassB.connect(gainNode);
        gainNode.connect(ctx.destination);

        source.onended = () => {
          source.disconnect();
          lowpassA.disconnect();
          lowpassB.disconnect();
          gainNode.disconnect();
        };

        source.start(0);
      } catch (_) {}

      if (previous === next) return;

        suffix < previous.length - prefix &&

        if (used.y > f.y) result.push({ x: f.x, y: f.y, w: f.w, h: used.y - f.y });
        if (used.y + used.h < f.y + f.h) result.push({
          x: f.x, y: used.y + used.h, w: f.w, h: f.y + f.h - used.y - used.h
        });
      }
      return result.filter((r, i) => r.w > 0.001 && r.h > 0.001 &&
        !result.some((q, j) => j !== i &&
          q.x <= r.x && q.y <= r.y && q.x + q.w >= r.x + r.w &&
          q.y + q.h >= r.y + r.h &&
          (q.x !== r.x || q.y !== r.y || q.w !== r.w || q.h !== r.h || j < i)));
    }

    function motherFindSlot(freeRects, width, height, angles) {
      for (const angle of angles) {
        const sideways = angle === 90 || angle === 270;
        const w = sideways ? height : width;
        const h = sideways ? width : height;
        let best = null;
        for (const f of freeRects) {
          if (w > f.w + 0.000001 || h > f.h + 0.000001) continue;
          if (!best || f.y < best.y || (f.y === best.y && f.x < best.x)) {
            best = { x: f.x, y: f.y, w, h, angle };
          }
        }
        if (best) return best;
      }
      return null;
    }

    function motherImageTransform(angle, w, h) {
      switch (angle) {
        case 90: return `translateX(${h}px) rotate(90deg)`;
        case 180: return `translate(${w}px, ${h}px) rotate(180deg)`;
        case 270: return `translateY(${w}px) rotate(270deg)`;
        default: return "none";
      }
    }

    function layoutMotherPuzzle() {
      const state = roomStates.mother;
      const width = Math.max(1, scene.clientWidth);
      const height = Math.max(1, scene.clientHeight);
      const pageViews = state.motherPageViews || (state.motherPageViews = new Map());
      let page = 0;
      let hasNormal = false;
      let free = [{ x: 0, y: 0, w: width, h: height }];
      let waiting = false;
      const livePages = new Set([0]);

      function getPage(index) {
        livePages.add(index);
        let view = pageViews.get(index);
        if (!view) {
          view = document.createElement("div");
          view.className = "mother-puzzle-page";
          pageViews.set(index, view);
        }
        Object.assign(view.style, {
          position: "absolute", overflow: "hidden",
          left: `${index * width}px`, top: "0px",
          width: `${width}px`, height: `${height}px`
        });
        if (view.parentNode !== imageWorld) imageWorld.appendChild(view);
        return view;
      }

      getPage(0);
      for (const record of state.tiles) {
        const tile = record.element;
        // 실제 크기를 알기 전에는 임시 크기로 공간을 점유하지 않는다.
        if (waiting || !record.imageSettled) {
          waiting = true;
          tile.style.visibility = "hidden";
          continue;
        }
        const elastic = elasticJamos.has(record.jamo);
        const scale = elastic ? ROOM_EFFECTS.motherElasticScale : rooms.mother.scale;
        const w = record.naturalWidth * scale;
        const h = record.naturalHeight * scale;
        let x, y, boxW = w, boxH = h, angle = 0;

        if (elastic) {
          x = width * (0.08 + record.randomX * 0.84) - w / 2;
          y = height * (0.12 + record.randomY * 0.70) - h / 2;
        } else {
          let slot = motherFindSlot(free, w, h, record.puzzleAngles);
          if (!slot && hasNormal) {
            page++;
            hasNormal = false;
            free = [{ x: 0, y: 0, w: width, h: height }];
            slot = motherFindSlot(free, w, h, record.puzzleAngles);
          }
          if (!slot) {
            // 40% 크기조차 화면보다 크면 더 축소하지 않고 전용 페이지에서 잘라 보인다.
            angle = record.puzzleAngles[0];
            boxW = angle % 180 ? h : w;
            boxH = angle % 180 ? w : h;
            slot = { x: 0, y: 0, w: boxW, h: boxH, angle };
            free = [];
          } else {
            free = motherSplitFree(free, slot);
          }
          hasNormal = true;
          angle = slot.angle;
          boxW = slot.w;
          boxH = slot.h;
          x = slot.x;
          y = height - slot.y - slot.h;
        }

        record.motherPage = page;
        const view = getPage(page);
        if (tile.parentNode !== view) view.appendChild(tile);
        Object.assign(tile.style, {
          visibility: "visible", left: `${x}px`, top: `${y}px`,
          width: `${boxW}px`, height: `${boxH}px`,
          transform: "none", zIndex: elastic ? "2" : "1"
        });
        Object.assign(record.visual.style, {
          width: `${w}px`, height: `${h}px`,
          transform: motherImageTransform(angle, w, h)
        });
        if (elastic && !record.motherAnimated) {
          record.motherAnimated = true;
          applyElasticAnimation(record);
        }
      }

      for (const [index, view] of pageViews) {
        if (!livePages.has(index)) {
          view.remove();
          pageViews.delete(index);
        }
      }
      const sameSize = state.motherViewportWidth === width && state.motherViewportHeight === height;
      const animate = state.motherCameraPage != null && sameSize && state.motherCameraPage !== page;
      if (animate) {
        // 이전 페이지에서 새 페이지로 넘어갈 때만 카메라를 이동한다.
        imageWorld.style.transition = "none";
        imageWorld.style.transform = `translate(${-state.motherCameraPage * width}px, 0px)`;
        void imageWorld.offsetWidth;
        imageWorld.style.transition = window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ? "none" : `transform ${ROOM_EFFECTS.motherSlideMs}ms cubic-bezier(.22,.68,.22,1)`;
      } else if (!sameSize || state.motherCameraPage == null) {
        imageWorld.style.transition = "none";
      }
      imageWorld.style.transform = `translate(${-page * width}px, 0px)`;
      updateRoomBackground(page * width, 0);
      state.motherCameraPage = page;
      state.motherViewportWidth = width;
      state.motherViewportHeight = height;
    }

    function layoutImages() {
      if (currentRoom === "mother") {
        layoutMotherPuzzle();
        return;
      }
      imageWorld.style.transition = "none";
      const room = rooms[currentRoom];
      const state = roomStates[currentRoom];

      const viewportWidth = scene.clientWidth;
      const viewportHeight = scene.clientHeight;

      let cursorX = 0;
      let towerTop = viewportHeight;
      let flowTileCount = 0;

      const scatterRecords = [];

      state.tiles.forEach(record => {
        const isSpecialJamo = elasticJamos.has(record.jamo);
        const isElastic = isSpecialJamo && currentRoom !== "kitchen";

        const isRotated =
          !isElastic &&
          room.rotation === -90;

const extraScale = isSpecialJamo ? 0.5 : 1;

const originalWidth =
  record.naturalWidth * room.scale * extraScale * record.stretchX;

const originalHeight =
  record.naturalHeight * room.scale * extraScale * record.stretchY;

        const width = isRotated
          ? originalHeight
          : originalWidth;

        const height = isRotated
          ? originalWidth
          : originalHeight;

        const tile = record.element;
        const visual = record.visual;

        tile.style.width = `${width}px`;
        tile.style.height = `${height}px`;

        visual.style.width = `${originalWidth}px`;
        visual.style.height = `${originalHeight}px`;

        visual.style.transform = isRotated
          ? `translateY(${originalWidth}px) rotate(-90deg)`
          : "none";

        tile.style.transform = "none";
        tile.style.transformOrigin = "center";
        tile.style.zIndex = isElastic ? "2" : "1";


        if (isElastic) {
          scatterRecords.push({
            record,
            width,
            height
          });

          return;
        }

        let x = 0;
        let y = 0;

        switch (room.mode) {
          case "row":
            x = cursorX;
            y = viewportHeight - height;

            cursorX += width + IMAGE_GAP;
            flowTileCount++;
            break;

          case "tower":
            x = (viewportWidth - width) / 2;
            y = towerTop - height;

            towerTop = y - IMAGE_GAP;
            flowTileCount++;
            break;

          case "scatter":
            x = viewportWidth * record.randomX - width / 2;
            y = viewportHeight * record.randomY - height / 2;

            tile.style.transform =
              `rotate(${record.randomRotation}deg)`;
            break;
        }

        tile.style.left = `${x}px`;
        tile.style.top = `${y}px`;
      });

      const cameraX =
        flowTileCount > 0 && room.mode === "row"
          ? Math.max(
              0,
              cursorX - IMAGE_GAP - viewportWidth
            )
          : 0;

      const cameraY =
        flowTileCount > 0 && room.mode === "tower"
          ? Math.min(
              0,
              towerTop + IMAGE_GAP
            )
          : 0;

      imageWorld.style.transform =
        `translate(${-cameraX}px, ${-cameraY}px)`;

      updateRoomBackground(cameraX, cameraY);

      scatterRecords.forEach(({ record, width, height }) => {
        if (!record.scatterPosition) {
          record.scatterPosition = {
            x:
              viewportWidth *
              (0.08 + record.randomX * (0.92 - 0.08)) +
              cameraX,

            y:
              viewportHeight *
              (0.12 + record.randomY * (0.82 - 0.12)) +
              cameraY
          };
        }

        record.element.style.left =
          `${record.scatterPosition.x - width / 2}px`;

        record.element.style.top =
          `${record.scatterPosition.y - height / 2}px`;
      });
    }

  

    function syncJamoImages() {
      const room = rooms[currentRoom];

      if (!room.typing) return;

      if (!composing) {
        sanitizeHangulInput();
      }

      const state = roomStates[currentRoom];
      const previousText = state.text;
      const nextText = filterHangul(imeInput.value);

      updateChronologicalRecord(
        currentRoom,
        previousText,
        nextText
      );

      
      window.typingMp3?.capture(currentRoom, previousText, nextText);
      playChangedTypingSounds(
        previousText,
        nextText
      );

      state.text = nextText;

      if (room.mode === "none") return;

      const entries = textToImageEntries(state.text);
      const jamos = entries.map(entry => entry.jamo);

      let sharedLength = 0;

      while (
        sharedLength < state.tiles.length &&
        sharedLength < jamos.length &&
        state.tiles[sharedLength].jamo === jamos[sharedLength]
      ) {
        sharedLength++;
      }

      while (state.tiles.length > sharedLength) {
        state.tiles.pop().element.remove();
      }

      for (let i = sharedLength; i < jamos.length; i++) {
        const record = createTile(
          jamos[i],
          currentRoom
        );

        state.tiles.push(record);
        imageWorld.appendChild(record.element);
      }

      state.tiles.forEach((record, index) => {
        record.wordStart = entries[index].wordStart;
        refreshRoomVisual(record);
      });

      layoutImages();
    }



    /* =========================
       기록 페이지 나누기 / PDF 다운로드
       메일 발송이나 서버 호출은 하지 않음
    ========================= */

    const PDF_WIDTH = 720;
    const PDF_HEIGHT = PDF_WIDTH * 297 / 210;
    const MAX_PDF_PAGES = 200;
    let pdfDownloading = false;
    let previewBuilding = false;
    let recordPages = [];
    let recordLayout = null;
    let recordBuildId = 0;
    let pdfLibraryPromise = null;
    let recordResizeTimer = null;

    const paperGroup = previewDialog.querySelector('.preview-paper-group');
    const firstPaper = previewDialog.querySelector('.preview-paper');
    const paperActionArea = firstPaper.querySelector('.paper-send-area');

    // 조작 버튼은 종이 밖으로 이동하여 기록 글씨와 겹치지 않음
    paperGroup.appendChild(paperActionArea);

    function captureRecordLayout() {
      const textStyle = getComputedStyle(previewContent);
      const areaStyle = getComputedStyle(paperTextArea);
      const width = firstPaper.clientWidth;
      const height = firstPaper.clientHeight;
      const scale = PDF_WIDTH / width;
      const fontSize = parseFloat(textStyle.fontSize) || 18;
      const lineHeight = parseFloat(textStyle.lineHeight);
      return {
        fontFamily: textStyle.fontFamily,
        fontWeight: textStyle.fontWeight,
        fontStyle: textStyle.fontStyle,
        fontSize: fontSize * scale,
        lineHeight: Number.isFinite(lineHeight) ? lineHeight / fontSize : 1.9,
        letterSpacing: (parseFloat(textStyle.letterSpacing) || 0) * scale,
        color: textStyle.color,
        top: (parseFloat(areaStyle.top) || 0) / height,
        right: (parseFloat(areaStyle.right) || 0) / width,
        bottom: (parseFloat(areaStyle.bottom) || 0) / height,
        left: (parseFloat(areaStyle.left) || 0) / width
      };
    }

    function createRenderStage(layout) {
      const stage = document.createElement('div');
      stage.className = 'pdf-render-stage';
      stage.setAttribute('aria-hidden', 'true');
      const page = document.createElement('article');
      page.className = 'pdf-render-page';
      const area = document.createElement('div');
      area.className = 'pdf-render-area';
      Object.assign(area.style, {
        top: `${layout.top * 100}%`,
        right: `${layout.right * 100}%`,
        bottom: `${layout.bottom * 100}%`,
        left: `${layout.left * 100}%`
      });
      const text = document.createElement('p');
      text.className = 'pdf-render-text';
      Object.assign(text.style, {
        fontFamily: layout.fontFamily,
        fontWeight: layout.fontWeight,
        fontStyle: layout.fontStyle,
        fontSize: `${layout.fontSize}px`,
        lineHeight: String(layout.lineHeight),
        letterSpacing: `${layout.letterSpacing}px`,
        color: layout.color
      });
      area.appendChild(text);
      page.appendChild(area);
      stage.appendChild(page);
      document.body.appendChild(stage);
      return { stage, page, area, text };
    }

    function splitRecordIntoPages(value, layout) {
      const render = createRenderStage(layout);
      try {
        const segments = typeof Intl.Segmenter === 'function'
          ? Array.from(new Intl.Segmenter('ko', { granularity: 'grapheme' }).segment(value), item => item.segment)
          : Array.from(value);
        if (!segments.length) return [''];
        const pages = [];
        let offset = 0;
        while (offset < segments.length) {
          if (pages.length >= MAX_PDF_PAGES) {
            throw new Error('기록이 200페이지를 넘습니다. 분량을 줄인 뒤 다시 저장해주세요.');
          }
          let low = 0;
          let high = segments.length - offset;
          // 실제 폰트와 줄바꿈으로 한 장에 들어갈 최대 분량을 측정
          while (low < high) {
            const middle = Math.ceil((low + high) / 2);
            render.text.textContent = segments.slice(offset, offset + middle).join('');
            if (render.text.getBoundingClientRect().height <= render.area.getBoundingClientRect().height - 0.5) {
              low = middle;
            } else {
              high = middle - 1;
            }
          }
          if (low === 0) {
            throw new Error('현재 글자 크기가 PDF의 글 영역보다 큽니다. 글자 크기나 여백을 조정해주세요.');
          }
          pages.push(segments.slice(offset, offset + low).join(''));
          offset += low;
        }
        return pages;
      } finally {
        render.stage.remove();
      }
    }


    /* 記録: テキストとは独立した図形の改行・改ページ */
    const RECORD_SCORE = {
      color: "#242321", opacity: 0.65, strokeEm: 0.025,
      cellEm: 0.92, gapEm: 0.3, squareEm: 0.5,
      circleDiameterEm: 0.48, circleGapEm: 0.06,
      overlapEm: 0.002, spaceEm: 0.55
    };
    let recordScorePages = [];

    function paginateScoreLines(lines, geometry, maxPages = 200) {
      const {left, right, top, bottom, fs, lineHeight} = geometry;
      const cfg = RECORD_SCORE;
      const cell = fs * cfg.cellEm;
      const stroke = fs * cfg.strokeEm;
      const square = fs * cfg.squareEm;
      const diameter = fs * cfg.circleDiameterEm;
      const circleGap = fs * cfg.circleGapEm;
      const stack = diameter * 3 + circleGap * 2;
      const symbolHeight = Math.max(square, stack);
      const xStart = left + stroke / 2;
      const xEnd = right - stroke / 2;
      const firstBottom = top + symbolHeight + stroke / 2;
      const lastBottom = bottom - stroke / 2;
      if (xEnd - xStart < Math.max(cell, square, diameter) || firstBottom > lastBottom) {
        throw new Error('도형이 기록 여백 안에 들어가지 않습니다. 도형 크기를 줄여주세요.');
      }
      const pages = [];
      /* 첫 글줄의 도형은 상단 여백 보정 없이 글자 기준으로 배치 */
let page = 0;
let rowBottom = -Infinity;
let x = xStart;

      function ensurePage() {
        if (page >= maxPages) throw new Error('도형 기록이 200페이지를 넘습니다.');
        while (pages.length <= page) pages.push([]);
      }
      function checkBottom() {
        if (rowBottom > lastBottom) {
          page++;
          rowBottom = firstBottom;
          x = xStart;
        }
        ensurePage();
      }
      for (const line of lines) {
        if (!line.tokens.some(token => token !== 'space')) continue;
        if (page < line.page) {
  page = line.page;

  /* 새 텍스트 페이지의 첫 줄도 글자 기준으로 배치 */
  rowBottom = -Infinity;
}
        if (page === line.page) rowBottom = Math.max(rowBottom, line.anchor);
        x = xStart;
        checkBottom();
        for (const token of line.tokens) {
          if (token === 'space') {
            x = Math.min(xEnd, x + fs * cfg.spaceEm);
            continue;
          }
          if (x + cell > xEnd) {
            rowBottom += lineHeight;
            x = xStart;
            checkBottom();
          }
          const shapes = pages[page];
          if (token === 'circles') {
            for (let i = 0; i < 3; i++) shapes.push({
              tag: 'circle', cx: x + cell / 2,
              cy: rowBottom - stack + diameter / 2 + i * (diameter + circleGap),
              r: diameter / 2
            });
          } else {
            shapes.push({tag: 'rect', x: x + (cell - square) / 2,
              y: rowBottom - square, width: square, height: square});
          }
          x += cell + fs * cfg.gapEm;
        }
        rowBottom += lineHeight;
      }
      return pages;
    }

    function buildRecordScorePages(textPages, layout) {
      const render = createRenderStage(layout);
      try {
        const fullText = textPages.join('');
        const newline = String.fromCharCode(10);
        const carriage = String.fromCharCode(13);
        const ignored = [];
        const visitorHeader = fullText.match(/^방문객 \d+\n\n/);
        if (visitorHeader) ignored.push([0, visitorHeader[0].length]);
        let paragraphStart = 0;
        for (const paragraph of fullText.split(newline)) {
          const mark = paragraph.indexOf(' ··· ');
          if (mark >= 0) ignored.push([paragraphStart + mark, paragraphStart + paragraph.length]);
          paragraphStart += paragraph.length + 1;
        }
        const lines = [];
        const range = document.createRange();
        let globalStart = 0;
        for (let page = 0; page < textPages.length; page++) {
          render.text.textContent = textPages[page];
          const node = render.text.firstChild;
          if (!node) continue;
          const pageBounds = render.page.getBoundingClientRect();
          let offset = 0;
          let line = null;
          for (const char of node.data) {
            const start = offset;
            offset += char.length;
            const absolute = globalStart + start;
            if (char === newline || char === carriage || ignored.some(([a,b]) => absolute >= a && absolute < b)) continue;
            range.setStart(node, start);
            range.setEnd(node, offset);
            const bounds = range.getBoundingClientRect();
            if (!bounds.height) continue;
            const y = bounds.top - pageBounds.top;
            if (!line || Math.abs(line.y - y) > 1) {
              line = {page, y, anchor: y + layout.fontSize * RECORD_SCORE.overlapEm, tokens: []};
              lines.push(line);
            }
            if (char.trim() === '') line.tokens.push('space');
            else {
              for (const jamo of decomposeCharacter(char)) {
                if (!CHOSEONG.includes(jamo) && !JUNGSEONG.includes(jamo)) continue;
                line.tokens.push(elasticJamos.has(jamo) ? 'circles' : 'square');
              }
            }
          }
          globalStart += textPages[page].length;
        }
        range.detach();
        return paginateScoreLines(lines, {
          left: layout.left * PDF_WIDTH,
          right: (1 - layout.right) * PDF_WIDTH,
          top: layout.top * PDF_HEIGHT,
          bottom: (1 - layout.bottom) * PDF_HEIGHT,
          fs: layout.fontSize,
          lineHeight: layout.fontSize * layout.lineHeight
        }, MAX_PDF_PAGES);
      } finally { render.stage.remove(); }
    }

    function recordScoreSvg(shapes, fs) {
      const cfg = RECORD_SCORE;
      const content = shapes.map(({tag, ...attrs}) =>
        '<' + tag + ' ' + Object.entries(attrs).map(([k,v]) => k + '="' + v + '"').join(' ') + '/>'
      ).join('');
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + PDF_WIDTH + '" height="' + PDF_HEIGHT +
        '" viewBox="0 0 ' + PDF_WIDTH + ' ' + PDF_HEIGHT + '">' +
        '<g fill="none" stroke="' + cfg.color + '" stroke-width="' + (fs * cfg.strokeEm) +
        '" opacity="' + cfg.opacity + '">' + content + '</g></svg>';
    }

    async function placeRecordScore(page, shapes, layout, pdf = false) {
      page.querySelectorAll('.record-score-overlay').forEach(el => el.remove());
      if (!shapes?.length) return;
      const markup = recordScoreSvg(shapes, layout.fontSize);
      if (pdf) {
        const image = new Image();
        image.className = 'record-score-overlay';
        image.alt = '';
        image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
        await image.decode();
        page.appendChild(image);
      } else {
        const layer = document.createElement('div');
        layer.className = 'record-score-overlay';
        layer.setAttribute('aria-hidden', 'true');
        layer.innerHTML = markup;
        page.appendChild(layer);
      }
    }

    async function updateRecordPaperPages(pages) {
      paperGroup.querySelectorAll('.record-extra-page').forEach(page => page.remove());
      previewContent.textContent = pages[0] || '';
      paperTextArea.scrollTop = 0;
      let previousPaper = firstPaper;
      for (let index = 1; index < pages.length; index++) {
        const paper = document.createElement('article');
        paper.className = 'preview-paper record-extra-page';
        paper.setAttribute('aria-label', `기록 ${index + 1}페이지`);
        const area = document.createElement('div');
        area.className = 'paper-text-area';
        const text = document.createElement('p');
        text.className = 'preview-content';
        text.textContent = pages[index];
        area.appendChild(text);
        paper.appendChild(area);
        previousPaper.after(paper);
        previousPaper = paper;
      }
      await Promise.all([...paperGroup.querySelectorAll('.preview-paper')].map((page, index) =>
        placeRecordScore(page, recordScorePages[index], recordLayout)
      ));
    }

    async function rebuildRecordPages() {
      const buildId = ++recordBuildId;
      previewBuilding = true;
      paperSendButton.disabled = true;
      try {
        const style = getComputedStyle(previewContent);
        await document.fonts.load(`${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`);
        await document.fonts.ready;
        if (!previewDialog.open || buildId !== recordBuildId) return;
        const layout = captureRecordLayout();
        const pages = splitRecordIntoPages(previewSnapshot, layout);
        const scorePages = buildRecordScorePages(pages, layout);
        while (pages.length < scorePages.length) pages.push('');
        recordLayout = layout;
        recordPages = pages;
        recordScorePages = scorePages;
        await updateRecordPaperPages(pages);
      } finally {

      const previous = raw === null ? 0 : Number(raw);

    function loadScriptFrom(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          script.remove();
          reject(new Error('라이브러리 불러오기 시간 초과'));
        }, 15000);
        script.src = src;
        script.onload = () => { clearTimeout(timeout); resolve(); };
        script.onerror = () => { clearTimeout(timeout); script.remove(); reject(new Error('라이브러리 불러오기 실패')); };
        document.head.appendChild(script);
      });
    }

    function stopKeyDrag() {
      const drag = keyDrag;
      keyDrag = null;

      if (
        drag &&
        storageKey.hasPointerCapture(drag.id)

      keyDrag = {
        id: event.pointerId,

        dy: event.clientY - rect.top
      };

      storageKey.style.left = `${rect.left - zone.left}px`;
      storageKey.style.top = `${rect.top - zone.top}px`;

      storageKey.classList.add("is-dragging");

    /* =========================
       창고 이미지 아카이브
       원본 비율 유지 / 부분 노출 검사 / 클릭 확대와 복원
    ========================= */
    const STORAGE_ARCHIVE_OPTIONS = {
      minWidth: 160,
      maxWidth: 240,
      maxHeight: 180,
      edge: 24,
      visiblePatch: 28,
      expandedWidth: 1100,
      expandedRatio: 0.88,
      layoutAttempts: 12,
      candidateAttempts: 64,
      shrinkRatio: 0.9,
      shrinkSteps: 32
    };
    let storageArchiveRoot = null;
    let storageArchiveItems = [];
    let storageArchiveRequest = 0;
    let storageArchiveSelected = null;
    let storageArchiveResizeFrame = null;

    function subtractArchiveRectangle(rect, cover) {
      const l = Math.max(rect.x, cover.x), t = Math.max(rect.y, cover.y);
      const r = Math.min(rect.x + rect.w, cover.x + cover.w);
      const b = Math.min(rect.y + rect.h, cover.y + cover.h);
      if (l >= r || t >= b) return [rect];
      const pieces = [];
      if (t > rect.y) pieces.push({x:rect.x, y:rect.y, w:rect.w, h:t-rect.y});
      if (b < rect.y+rect.h) pieces.push({x:rect.x, y:b, w:rect.w, h:rect.y+rect.h-b});
      if (l > rect.x) pieces.push({x:rect.x, y:t, w:l-rect.x, h:b-t});
      if (r < rect.x+rect.w) pieces.push({x:r, y:t, w:rect.x+rect.w-r, h:b-t});
      return pieces;
    }

    function archiveAllPhotosExposed(rects) {
      return rects.every((rect, index) => {
        let parts = [rect];
        for (let above = index + 1; above < rects.length; above++) {
          parts = parts.flatMap(part => subtractArchiveRectangle(part, rects[above]));
          if (!parts.length) return false;
        }
        const patchW = Math.min(STORAGE_ARCHIVE_OPTIONS.visiblePatch, rect.w * 0.25);
        const patchH = Math.min(STORAGE_ARCHIVE_OPTIONS.visiblePatch, rect.h * 0.25);
        return parts.some(part => part.w >= patchW && part.h >= patchH);
      });
    }

    function archiveRectanglesOverlap(rects) {
      return rects.some((a,i) => rects.slice(i+1).some(b =>
        a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y
      ));
    }

    function computeStorageArchiveLayout(items, width, height) {
      if (!items.length) return [];
      const cfg = STORAGE_ARCHIVE_OPTIONS;
      const edge = Math.min(cfg.edge, width * 0.06, height * 0.06);
      const areaW = Math.max(1, width - edge * 2);
      const areaH = Math.max(1, height - edge * 2);
      const baseSizes = items.map(item => {
        const scale = Math.min(item.preferredWidth / item.nw,
          cfg.maxHeight / item.nh, areaW / item.nw, areaH / item.nh);
        return {w: item.nw * scale, h: item.nh * scale};
      });
      const clamp = (value, low, high) => Math.max(low, Math.min(high, value));

      // 모든 사진에 노출 영역을 남기고, 실패하면 단계적으로 축소합니다.
      for (let step = 0; step <= cfg.shrinkSteps; step++) {
        const factor = Math.pow(cfg.shrinkRatio, step);
        const sizes = baseSizes.map(size => ({w: size.w * factor, h: size.h * factor}));
        for (let attempt = 0; attempt < cfg.layoutAttempts; attempt++) {
          const rects = [];
          let failed = false;
          for (let index = 0; index < sizes.length; index++) {
            const size = sizes[index];
            let placed = false;
            for (let trial = 0; trial < cfg.candidateAttempts; trial++) {
              let x = edge + Math.random() * (areaW - size.w);
              let y = edge + Math.random() * (areaH - size.h);
              if (index > 0 && (index === 1 || Math.random() < 0.6)) {
                const anchor = rects[Math.floor(Math.random() * rects.length)];
                x = anchor.x + (Math.random() * 1.8 - 0.6) * anchor.w;
                y = anchor.y + (Math.random() * 1.8 - 0.6) * anchor.h;
              }
              x = clamp(x, edge, width - edge - size.w);
              y = clamp(y, edge, height - edge - size.h);
              const candidate = {x, y, w: size.w, h: size.h};
              const next = [...rects, candidate];
              // 최소 한 쌍은 서로 겹치도록 합니다.
              if (index === 1 && !archiveRectanglesOverlap(next)) continue;
              if (!archiveAllPhotosExposed(next)) continue;
              rects.push(candidate);
              placed = true;
              break;
            }
            if (!placed) {
              failed = true;
              break;
            }
          }
          if (!failed && archiveAllPhotosExposed(rects) &&
              (rects.length < 2 || archiveRectanglesOverlap(rects))) return rects;
        }
      }
      throw new Error('창고 사진의 랜덤 배치를 만들지 못했습니다. 창 크기를 늘리거나 이미지 크기를 줄여주세요.');
    }

const ROOM_SLIDE = {
  duration: 500,
  easing: "cubic-bezier(0.22, 0.68, 0.22, 1)"
};

const NO_SLIDE_ROOMS = new Set([
  "storage",
  "closet"
]);

let roomSliding = false;

/* 현재 공간의 버튼 위치에서 이동 방향 확인 */
/* 현재 공간의 버튼 위치에서 이동 방향 확인 */
function getRoomSlideDirection(fromId, toId) {
  /*
    첫 화면 → 현관
    다음 화면이 위에서 들어오며,
    두 화면 모두 아래쪽으로 이동.
  */
  if (fromId === "entrance" && toId === "hall") {
    return "top";
  }

  /*
    현관 → 첫 화면
    다음 화면이 아래에서 들어오며,
    두 화면 모두 위쪽으로 이동.
  */
  if (fromId === "hall" && toId === "entrance") {
    return "bottom";
  }

  const room = rooms[fromId];

  const link = room.links.find(
    item => item.target === toId
  );

  if (link) {
    return link.position;
  }

  /* 나머지 돌아가기 버튼은 기존 위치 사용 */
  if (room.parent === toId) {
    return ROOM_BACK_POSITIONS[fromId] ?? "bottom";
  }

  return "bottom";
}

/* 다음 공간이 들어올 시작 위치 */
function getRoomSlideOffset(direction) {
  const width = scene.clientWidth;
  const height = scene.clientHeight;

  switch (direction) {
    case "entry-up":
      return { x: 0, y: height };

    case "right":
      return { x: width, y: 0 };

    case "left":
      return { x: -width, y: 0 };

    case "top":
      return { x: 0, y: -height };

    case "bottom":
      return { x: 0, y: height };

    case "top-right":
      return { x: width, y: -height };

    case "top-left":
      return { x: -width, y: -height };

    case "bottom-right":
      return { x: width, y: height };

    case "bottom-left":
      return { x: -width, y: height };

    default:
      return { x: 0, y: height };
  }
}

/* 이전 화면의 현재 모습을 복사 */
function makeRoomSlideSnapshot() {
  const snapshot = scene.cloneNode(true);

  const originalElements = [
    scene,
    ...scene.querySelectorAll("*")
  ];

  const copiedElements = [
    snapshot,
    ...snapshot.querySelectorAll("*")
  ];

  originalElements.forEach((element, index) => {
    const copy = copiedElements[index];
    const style = getComputedStyle(element);

    /*
      자모·배경이 이동 중이었다면
      현재 화면에 보이는 위치를 보존.
    */
    copy.style.transform = style.transform;

    /*
      중복 ID는 제거하되
      ID로 지정된 위치·크기·색상은 보존.
    */
    if (element.id) {
      const properties = [
        "position",
        "top",
        "right",
        "bottom",
        "left",
        "width",
        "height",
        "padding",
        "display",
        "align-items",
        "justify-content",
        "font-size",
        "line-height",
        "color",
        "background-color",
        "border",
        "border-radius"
      ];

      properties.forEach(property => {
        copy.style.setProperty(
          property,
          style.getPropertyValue(property)
        );
      });
    }

    copy.removeAttribute("id");
    copy.removeAttribute("autofocus");
  });

  /* 모자이크 등에 사용되는 캔버스 그림도 복사 */
  const originals = scene.querySelectorAll("canvas");
  const copies = snapshot.querySelectorAll("canvas");

  originals.forEach((canvas, index) => {
    const copy = copies[index];

    copy.width = canvas.width;
    copy.height = canvas.height;

    if (canvas.width && canvas.height) {
      copy.getContext("2d")?.drawImage(canvas, 0, 0);
    }
  });

  /*
    버튼은 이전 화면과 함께 움직이지 않으므로 제거.
    실제 navigation은 원래 위치에서 유지.
  */
  snapshot.querySelector(".navigation")?.remove();
  snapshot.querySelector(".ime-input")?.remove();
  snapshot.querySelector(".sr-only")?.remove();

  snapshot.classList.add("room-slide-snapshot");

  snapshot.setAttribute("aria-hidden", "true");
  snapshot.inert = true;

  snapshot.style.transform = "none";

  return snapshot;
}

/* 배경과 자모 화면만 슬라이드 */
async function slideToRoom(roomId) {
  if (roomSliding) return;

  const direction = getRoomSlideDirection(
    currentRoom,
    roomId
  );

  const offset = getRoomSlideOffset(direction);

  roomSliding = true;

  let snapshot = null;
  const animations = [];

  try {
    snapshot = makeRoomSlideSnapshot();

    /*
      scene 안에 넣어서 실제 내비게이션보다
      아래쪽 레이어에서 움직이게 한다.
    */
    scene.appendChild(snapshot);

    document.body.classList.add(
      "is-room-sliding"
    );

    /*
      기존 공간 변경 처리를 그대로 실행.
      음악·기록·버튼 갱신도 기존 함수가 담당.
    */
    renderRoom(roomId, false);

    /* 다음 공간의 배경색을 배경 레이어에도 적용 */
    roomImage.style.backgroundColor =
      rooms[roomId].color;

    /* 전환 도중 입력과 버튼 연속 조작 방지 */
    scene.inert = true;

    const options = {
      duration: ROOM_SLIDE.duration,
      easing: ROOM_SLIDE.easing,
      fill: "both"
    };

    /* 이전 공간은 반대 방향으로 빠져나간다 */
    animations.push(
      snapshot.animate(
        [
          {
            transform: "translate3d(0, 0, 0)"
          },
          {
            transform:
              `translate3d(${-offset.x}px, ${-offset.y}px, 0)`
          }
        ],
        options
      )
    );

    /*
      새 공간의 배경과 이미지 레이어만 움직인다.
      navigation과 scene 자체는 움직이지 않는다.
    */
    const incomingLayers = [
      roomImage,
      scene.querySelector(".image-viewport")
    ].filter(Boolean);

    incomingLayers.forEach(layer => {
      animations.push(
        layer.animate(
          [
            {
              transform:
                `translate3d(${offset.x}px, ${offset.y}px, 0)`
            },
            {
              transform: "translate3d(0, 0, 0)"
            }
          ],
          options
        )
      );
    });

    await Promise.all(
      animations.map(animation => animation.finished)
    );
  } finally {
    animations.forEach(animation => {
      animation.cancel();
    });

    snapshot?.remove();

    scene.inert = false;

    document.body.classList.remove(
      "is-room-sliding"
    );

    roomSliding = false;

    /* 이동 완료 후 입력 포커스 복원 */
    if (rooms[currentRoom].typing) {
      focusInput(true);
    } else {
      const selector =
        currentRoom === "studio"
          ? "#recordButton"
          : "button";

      navigation
        .querySelector(selector)
        ?.focus({ preventScroll: true });
    }
  }
}

    function moveTo(roomId) {
  if (
    roomSliding ||
    !rooms[roomId] ||
    roomId === currentRoom
  ) {
    return;
  }

  /* 창고 입장은 기존 암호·열쇠 과정 유지 */
  if (roomId === "storage") {
    openStorageKeypad();
    return;
  }

  /* 이동 전에 입력 중인 한글과 기록 정리 */
  if (rooms[currentRoom].typing) {
    imeInput.blur();
    syncJamoImages();
  }

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  const skipSlide =
    reducedMotion ||
    NO_SLIDE_ROOMS.has(currentRoom) ||
    NO_SLIDE_ROOMS.has(roomId);

  /* 창고·옷장 출입은 효과 없이 바로 변경 */
  if (skipSlide) {
    renderRoom(roomId, true);
    return;
  }

  /* 나머지 공간은 버튼 방향으로 이동 */
  slideToRoom(roomId).catch(error => {
    console.error("공간 전환 실패:", error);
  });
}

window.typingMp3 = (() => {
  const roomTokens = new Map(), sentences = [];
  let active = null, libraryPromise = null;
  function finishSentence() { active = null; }
  function tokenize(text) {
    const items = [];

    const next = tokenize(nextText);

    while (prefix < old.length && prefix < next.length && old[prefix].key === next[prefix].key) prefix++;
